<style>
.guts-hole{
  position:fixed;
  right:8%;
  bottom:11%;
  width:168px;
  height:112px;
  z-index:6;
  opacity:0;
  cursor:pointer;
  overflow:hidden;
  border:1px solid #1a0a0a;
}
.guts-hole:hover,.guts-hole:focus{
  opacity:1;
}
.guts-hole img{
  display:block;
  width:168px;
  height:112px;
  object-fit:cover;
  filter:contrast(1.4) saturate(.65);
  image-rendering:pixelated;
}
#sortLayer{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  width:100%;
  height:100%;
}

<body>
<div class="night-grid">
  <p class="talk-line">петар</p>
  <div class="talk-gap"></div>
  <p class="talk-line">в рапорте девять подписей. лист вернули без приложений.</p>
  <div class="talk-gap"></div>
  <p class="talk-line"><img class="portrait-break" src="assets/%D0%B5%D0%B3%D0%BE%D1%80%20%D0%B0%D1%80%D1%82%202.png" width="110" alt=""></p>
  <div class="talk-gap"></div>
  <p class="talk-line"><a href="commits.html">cvs</a> · <a href="kisiljevo.html">рапорт</a></p>
</div>
<a class="guts-hole" id="gutsHole" href="i.html">
  <img src="" id="gutsImg" alt="">
</a>
<canvas id="sortLayer"></canvas>
<script>
fetch("assets/guts.txt").then(function(r){return r.text()}).then(function(t){
  var im=document.getElementById("gutsImg");
  if(im) im.src="data:image/jpeg;base64,"+t.replace(/\s/g,"");
});
</script>
<script>
(function(){
  var hole=document.getElementById("gutsHole");
  var layer=document.getElementById("sortLayer");
  if(!hole||!layer) return;
  hole.addEventListener("click", function(e){
    e.preventDefault();
    scream();
    sortThenGo();
  });
  function scream(){
    try{
      var ac=new (window.AudioContext||window.webkitAudioContext)();
      var t0=ac.currentTime;
      var sr=ac.sampleRate;
      var dur=1.65;
      var buf=ac.createBuffer(1, Math.floor(sr*dur), sr);
      var d=buf.getChannelData(0);
      var lp=0;
      for(var i=0;i<d.length;i++){
        var t=i/sr;
        var white=Math.random()*2-1;
        lp=lp*0.992+white*0.008;
        var grit=white-lp;
        var drag=Math.sin(2*Math.PI*(14+t*6)*t+Math.sin(t*37)*1.7);
        var tooth=Math.sin(2*Math.PI*(78+Math.sin(t*5.2)*22)*t);
        tooth=tooth>0.55?1:tooth<-0.55?-1:tooth*0.22;
        var env=Math.min(1,t*7)*Math.max(0,1-(t-0.16)/1.48);
        env*=0.68+0.32*Math.abs(Math.sin(2*Math.PI*t*2.8+lp*4));
        var burst=0;
        if((t>0.19&&t<0.38)||(t>0.67&&t<0.84)||(t>1.12&&t<1.31)){
          burst=grit*((i%9)<3?1.1:0.35);
        }
        var v=(lp*1.25+grit*0.28+drag*0.2+tooth*0.16+burst)*env*1.85;
        if(v>0.9) v=0.9+(v-0.9)*0.1;
        if(v<-0.9) v=-0.9+(v+0.9)*0.1;
        d[i]=v>1?1:v<-1?-1:v;
      }
      var src=ac.createBufferSource();
      src.buffer=buf;
      var bp=ac.createBiquadFilter();
      bp.type="bandpass";
      bp.frequency.setValueAtTime(310,t0);
      bp.frequency.linearRampToValueAtTime(640,t0+0.55);
      bp.frequency.linearRampToValueAtTime(220,t0+dur);
      bp.Q.value=2.8;
      var peak=ac.createBiquadFilter();
      peak.type="peaking";
      peak.frequency.value=2100;
      peak.Q.value=5;
      peak.gain.setValueAtTime(4.5,t0);
      peak.gain.linearRampToValueAtTime(-3,t0+dur);
      var gain=ac.createGain();
      gain.gain.setValueAtTime(0.0001,t0);
      gain.gain.exponentialRampToValueAtTime(0.88,t0+0.05);
      gain.gain.exponentialRampToValueAtTime(0.01,t0+dur);
      src.connect(bp);
      bp.connect(peak);
      peak.connect(gain);
      gain.connect(ac.destination);
      src.start(t0);
    }catch(err){}
  }
  function sortThenGo(){
    var w=Math.max(320, window.innerWidth);
    var h=Math.max(240, window.innerHeight);
    layer.width=w; layer.height=h;
    layer.style.display="block";
    var ctx=layer.getContext("2d");
    ctx.fillStyle="#040208";
    ctx.fillRect(0,0,w,h);
    var imgs=document.querySelectorAll("img");
    var pending=imgs.length||1;
    function doneDraw(){
      pending-=1;
      if(pending>0) return;
      runSort(ctx,w,h, function(){
        setTimeout(function(){ location.href="i.html"; }, 1500);
      });
    }
    if(!imgs.length) doneDraw();
    imgs.forEach(function(im, n){
      try{
        ctx.drawImage(im, 20+n*70, 40+n*36, im.naturalWidth?Math.min(220,im.naturalWidth):110, im.naturalHeight?Math.min(160,im.naturalHeight):90);
      }catch(err){}
      doneDraw();
    });
    ctx.fillStyle="#6a1020";
    ctx.fillRect(0, Math.floor(h*0.42), w, 18);
    ctx.fillStyle="#1c0810";
    ctx.fillRect(0, Math.floor(h*0.71), w, 9);
  }
  function runSort(ctx,w,h, done){
    var frame=0;
    function step(){
      var img=ctx.getImageData(0,0,w,h);
      var data=img.data;
      var thresh=40+frame*18;
      var dir=frame%2===0;
      for(var y=0;y<h;y+=1+((y*3)%2)){
        sortSpan(data,y,w,thresh,dir);
      }
      ctx.putImageData(img,0,0);
      frame+=1;
      if(frame<14) requestAnimationFrame(step);
      else done();
    }
    step();
  }
  function sortSpan(data,y,w,thresh,byLum){
    var row=new Array(w);
    for(var x=0;x<w;x++){
      var i=(y*w+x)*4;
      var l=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
      row[x]=[data[i],data[i+1],data[i+2],data[i+3],l];
    }
    var i=0;
    while(i<w){
      while(i<w && row[i][4]<thresh) i++;
      var s=i;
      while(i<w && row[i][4]>=thresh) i++;
      var sl=row.slice(s,i);
      sl.sort(function(a,b){ return byLum?a[4]-b[4]:b[4]-a[4]; });
      for(var k=0;k<sl.length;k++) row[s+k]=sl[k];
    }
    for(var x=0;x<w;x++){
      var p=(y*w+x)*4;
      data[p]=row[x][0]; data[p+1]=row[x][1]; data[p+2]=row[x][2];
    }
  }
})();
</script>
</body>
