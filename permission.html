<!doctype html>
<html lang="ru" data-page="permission">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vamprie?02</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="break.css?v=2">
<script src="fracture.js?v=2" defer></script>
<script src="script.js?v=2" defer></script>
</head>
<body>
<main class="permission-stage" id="permissionStage" hidden></main>
<script>
(function () {
  var stage = document.getElementById("permissionStage");
  var special = new URLSearchParams(location.search).get("burst") === "1";
  if (!stage || !special) return;
  stage.hidden = false;
  var pulse = document.createElement("button");
  pulse.type = "button";
  pulse.className = "permission-pulse";
  pulse.textContent = "ДАЙ...";
  stage.appendChild(pulse);

  function ask() {
    if (navigator.geolocation) {
      try { navigator.geolocation.getCurrentPosition(function () {}, function () {}, { timeout: 5000 }); } catch (error) {}
    }
    if (window.Notification && Notification.permission === "default") {
      try {
        var request = Notification.requestPermission();
        if (request && request.catch) request.catch(function () {});
      } catch (error) {}
    }
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().catch(function () {});
    }
  }

  var tries = 0;
  var closeTimer;
  pulse.addEventListener("click", function () {
    ask();
    tries += 1;
    window.clearTimeout(closeTimer);
    if (tries >= 3) {
      try { sessionStorage.setItem("egor02_permission_done", "1"); } catch (error) {}
      var back = new URLSearchParams(location.search).get("return");
      location.replace(back || "index.html");
      return;
    }
    closeTimer = window.setTimeout(function () { stage.remove(); }, 2500);
  });
  window.addEventListener("pagehide", function () {
    window.clearTimeout(closeTimer);
    stage.remove();
  });
})();
</script>
</body>
</html>
