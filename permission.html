<!doctype html>
<html lang="ru" data-page="permission">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vamprie?02</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="break.css?v=2">
<script src="fracture.js?v=2" defer></script>
<script src="script.js?v=2" defer></script>
</head>
<body>
<main class="permission-stage" id="permissionStage" hidden></main>
<script>
(function () {
  var stage = document.getElementById("permissionStage");
  var special = new URLSearchParams(location.search).get("burst") === "1";
  if (!stage || !special) return;
  stage.hidden = false;
  var pulse = document.createElement("div");
  pulse.className = "permission-pulse";
  pulse.textContent = "ДАЙ...";
  stage.appendChild(pulse);
  function ask() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function () {}, function () {});
    }
    if (window.Notification && Notification.permission === "default") {
      Notification.requestPermission().catch(function () {});
    }
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().catch(function () {});
    }
  }
  var tries = 0;
  function repeat() {
    ask();
    tries += 1;
    if (tries < 8) window.setTimeout(repeat, 900);
  }
  repeat();
})();
</script>
</body>
</html>
